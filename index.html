<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- All __SEO_*__ values come from src/data/portfolio.ts (see vite.config.ts). -->
    <title>__SEO_TITLE__</title>
    <meta name="description" content="__SEO_DESCRIPTION__" />
    <meta name="keywords" content="__SEO_KEYWORDS__" />
    <meta name="author" content="__SEO_AUTHOR__" />
    <link rel="canonical" href="__SEO_URL__" />
    <meta name="theme-color" content="#0b1120" />
    <meta name="color-scheme" content="dark light" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SEO_URL__" />
    <meta property="og:site_name" content="__SEO_AUTHOR__" />
    <meta property="og:title" content="__SEO_TITLE__" />
    <meta property="og:description" content="__SEO_DESCRIPTION__" />
    <meta property="og:image" content="__SEO_IMAGE__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="__SEO_IMAGE_ALT__" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="__SEO_TWITTER__" />
    <meta name="twitter:title" content="__SEO_TITLE__" />
    <meta name="twitter:description" content="__SEO_DESCRIPTION__" />
    <meta name="twitter:image" content="__SEO_IMAGE__" />
    <meta name="twitter:image:alt" content="__SEO_IMAGE_ALT__" />

    <script type="application/ld+json">__SEO_JSONLD__</script>

    <!--
      Theme bootstrap. It runs before first paint so there is no flash of the wrong theme.
      Order: saved choice → OS preference → dark.
      To make dark the default for everyone, even visitors whose OS is set to light,
      change RESPECT_SYSTEM to false (and in src/hooks/useTheme.ts).
    -->
    <script>
      ;(function () {
        var RESPECT_SYSTEM = true
        var theme = 'dark'
        try {
          var saved = localStorage.getItem('theme')
          if (saved === 'light' || saved === 'dark') theme = saved
          else if (RESPECT_SYSTEM && window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light'
        } catch (e) {}
        var root = document.documentElement
        root.classList.toggle('dark', theme === 'dark')
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0b1120' : '#f8fafc')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 1rem; font-family: sans-serif">
        This site needs JavaScript. You can reach Nirbhik at
        <a href="mailto:__SEO_EMAIL__">__SEO_EMAIL__</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
